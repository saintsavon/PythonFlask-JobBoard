name: Runtime smoke

on:
  pull_request:
  push:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python -m pytest tests/test_runtime_smoke.py -q
